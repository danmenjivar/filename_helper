<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Accounting File Name Helper</title>
</head>

<body>
    <h1>Accounting File Name Helper</h1>
    <label for="month">Month:</label>
    <input type="month" id="month" placeholder="yyyy-mm" />
    <div>
        <label for="filenames">Enter filenames, one per line:</label>
        <textarea id="filenames" name="filenames" rows="5" cols="33">
        </textarea>
    </div>
    <button id="generate">Generate</button>
    <p id="generated_filenames"></p>

    <script src="./script.js"></script>
</body>

</html>
